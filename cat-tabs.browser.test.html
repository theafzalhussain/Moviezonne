<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MovieZone — category tab grouping harness</title>
</head>
<body>
<h1>Category tab grouping harness</h1>
<p>Loads the real index.html in a same-origin iframe and drives the actual
   category strip: the production markup, CSS and moviezone.js, not a copy.</p>
<iframe id="app" src="/index.html" style="width:1280px;height:900px;border:1px solid #333"></iframe>

<script>
(function () {
  var checks = [];
  function ok(name, pass, detail) {
    checks.push({ name: name, pass: !!pass, detail: detail || '' });
  }
  function report() {
    try {
      fetch('/__results', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(checks)
      });
    } catch (e) { /* the runner will time out and fail loudly */ }
  }

  // Categories that must remain reachable somewhere in the strip after grouping.
  // 'dubbed' was intentionally dropped from the UI, so it is not listed.
  /*  The nine OTT platforms are deliberately NOT here. They no longer have a
      .cat-tab at all: the OTT Platform dropdown was removed and a platform is
      opened from the Top Providers rail. ott-sections-check.js asserts each one
      has a data-provider-cat card and does NOT have a cat-tab. */
  var REQUIRED = ['all', 'trending', 'uhd4k', 'toprated', 'hollywood', 'bollywood',
    'south', 'kdrama', 'anime', 'kids', 'adult', 'tv', 'tollywood',
    'action', 'comedy', 'horror', 'thriller',
    'romance', 'scifi', 'adventure', 'fantasy', 'crime', 'documentary', 'family',
    'animation'];
  var GONE_FROM_TABS = ['netflix', 'prime', 'jiohotstar', 'zee5', 'apple',
    'sonyliv', 'mxplayer', 'aha', 'crunchyroll',
    'sunnxt', 'lionsgate', 'vi', 'discoveryplus', 'shemaroo'];

  // Only these belong on the strip itself (everything else moved to a dropdown).
  var DIRECT = ['all', 'trending', 'uhd4k', 'toprated', 'hollywood', 'bollywood',
    'south', 'tv', 'kdrama', 'anime', 'kids', 'adult'];

  // Removed from the UI entirely by request.
  var REMOVED = ['dubbed'];

  var frame = document.getElementById('app');

  frame.addEventListener('load', function () {
    // moviezone.js wires the tab text and trigger state on DOMContentLoaded and
    // fires network loads after; give it a moment to settle before asserting.
    setTimeout(runChecks, 2500);
  });

  function catTabFor(doc, cat) {
    return doc.querySelector('.cat-tab[onclick*="filterCat(\'' + cat + '\')"]');
  }

  function runChecks() {
    var doc, win;
    try {
      doc = frame.contentDocument;
      win = frame.contentWindow;
    } catch (e) {
      ok('same-origin access to the app frame', false, e.message);
      report();
      return;
    }

    var strip = doc.getElementById('catTabs');
    ok('category strip exists', !!strip);
    if (!strip) { report(); return; }

    // ── 1. every category still reachable ────────────────────────────────
    var missing = REQUIRED.filter(function (c) { return !catTabFor(doc, c); });
    ok('all 30 categories still reachable', missing.length === 0, 'missing: ' + missing.join(', '));

    // ── 2. no duplicate pill for the same category ───────────────────────
    var dupes = REQUIRED.filter(function (c) {
      return doc.querySelectorAll('.cat-tab[onclick*="filterCat(\'' + c + '\')"]').length > 1;
    });
    ok('no category is rendered twice', dupes.length === 0, 'duplicated: ' + dupes.join(', '));

    // ── 3. strip holds only the direct tabs + watchlist + 2 triggers ──────
    var stripChildren = Array.prototype.filter.call(strip.children, function (el) {
      return el.classList.contains('cat-tab');
    });
    var stripCats = stripChildren.map(function (el) {
      var m = /filterCat\('([^']+)'\)/.exec(el.getAttribute('onclick') || '');
      return m ? m[1] : (/(showWatchlist)/.test(el.getAttribute('onclick') || '') ? 'watchlist' : '?');
    });
    var unexpected = stripCats.filter(function (c) {
      return c !== 'watchlist' && DIRECT.indexOf(c) === -1;
    });
    ok('strip carries no genre or platform pills',
      unexpected.length === 0, 'unexpected on strip: ' + unexpected.join(', '));

    ok('18+ moved out of the dropdown onto the strip',
      stripCats.indexOf('adult') !== -1 && !catTabFor(doc, 'adult').closest('.cat-group-menu'));

    ok('Web Series sits on the strip, not in the dropdown',
      stripCats.indexOf('tv') !== -1 && !catTabFor(doc, 'tv').closest('.cat-group-menu'));

    ok('Web Series is adjacent to the industry tabs',
      Math.abs(stripCats.indexOf('tv') - stripCats.indexOf('bollywood')) <= 2,
      'bollywood@' + stripCats.indexOf('bollywood') + ' tv@' + stripCats.indexOf('tv'));

    ok('Watchlist pill removed from the strip',
      !strip.querySelector('.cat-tab[onclick*="showWatchlist"]'));

    ok('Watchlist still reachable from the navbar',
      !!doc.querySelector('#navLinks a[onclick*="showWatchlist"]'));

    var stillPresent = REMOVED.filter(function (c) { return !!catTabFor(doc, c); });
    ok('removed categories are gone from the UI',
      stillPresent.length === 0, 'still present: ' + stillPresent.join(', '));

    var groups = strip.querySelectorAll('.cat-group');
    ok('one dropdown group present (OTT Platform was removed)',
      groups.length === 1, 'found ' + groups.length);
    ok('no OTT Platform dropdown remains',
      !doc.getElementById('catGroupOttBtn') && !doc.getElementById('catGroupOttMenu'));
    var stillTabbed = GONE_FROM_TABS.filter(function (c) { return !!catTabFor(doc, c); });
    ok('platforms are not in the tab strip any more',
      stillTabbed.length === 0, 'still tabbed: ' + stillTabbed.join(', '));

    var dropMenu = doc.getElementById('catGroupGenreMenu');
    // Assert the exact contents rather than a count, so an accidentally dropped
    // entry is named in the failure instead of just shifting a threshold.
    function menuCats(menu) {
      return Array.prototype.map.call(menu.querySelectorAll('.cat-group-item'), function (el) {
        var m = /filterCat\('([^']+)'\)/.exec(el.getAttribute('onclick') || '');
        return m ? m[1] : '?';
      });
    }
    var EXPECTED_GENRE = ['tollywood', 'action', 'comedy', 'horror', 'thriller',
      'romance', 'scifi', 'adventure', 'fantasy', 'crime', 'documentary',
      'family', 'animation'];

    ok('Category menu holds exactly the genre list',
      dropMenu && menuCats(dropMenu).join(',') === EXPECTED_GENRE.join(','),
      dropMenu ? menuCats(dropMenu).join(',') : 'no menu');

    // ── 4. menus start closed ────────────────────────────────────────────
    ok('dropdown menu starts hidden',
      dropMenu && win.getComputedStyle(dropMenu).display === 'none',
      dropMenu ? win.getComputedStyle(dropMenu).display : 'n/a');

    var dropTrigger = doc.getElementById('catGroupGenreBtn');
    ok('trigger reports collapsed via aria-expanded',
      dropTrigger && dropTrigger.getAttribute('aria-expanded') === 'false');

    // ── 4b. THE SIZING REGRESSION ────────────────────────────────────────
    // The global ripple handler injects a <span> whose inline width/height are
    // set from the button's own size. `.cat-tab span { position: relative }`
    // outranks `.ripple-span { position: absolute }`, so inside a flex button
    // that span became an in-flow ~143px flex item and inflated the trigger
    // from 145x37 to 294x164. Assert the trigger keeps its size across a click.
    function boxOf(el) {
      var r = el.getBoundingClientRect();
      return { w: Math.round(r.width), h: Math.round(r.height) };
    }
    var before = boxOf(dropTrigger);
    ok('trigger starts at a normal pill size',
      before.h > 24 && before.h < 56 && before.w > 80 && before.w < 220,
      before.w + 'x' + before.h);

    ok('trigger has no click transition', 
      win.getComputedStyle(dropTrigger).transitionDuration === '0s',
      win.getComputedStyle(dropTrigger).transitionDuration);

    // ── 5. trigger opens the menu ────────────────────────────────────────
    dropTrigger.click();
    var after = boxOf(dropTrigger);
    ok('trigger does not grow when clicked',
      after.w === before.w && after.h === before.h,
      before.w + 'x' + before.h + ' -> ' + after.w + 'x' + after.h);
    ok('no ripple span is injected into the trigger',
      !dropTrigger.querySelector('.ripple-span'));
    ok('group box stays pill-sized while open',
      boxOf(dropTrigger.closest('.cat-group')).h === before.h,
      String(boxOf(dropTrigger.closest('.cat-group')).h));

    ok('clicking the trigger opens the menu',
      win.getComputedStyle(dropMenu).display !== 'none',
      win.getComputedStyle(dropMenu).display);
    ok('aria-expanded flips to true', dropTrigger.getAttribute('aria-expanded') === 'true');

    // A normal pill must still get its ripple — only triggers are excluded.
    var plainPill = catTabFor(doc, 'bollywood');
    plainPill.click();
    ok('normal tabs keep their ripple effect', !!plainPill.querySelector('.ripple-span'));
    ok('a normal tab does not grow from its ripple either',
      boxOf(plainPill).h < 56, String(boxOf(plainPill).h));
    dropTrigger.click();

    /*  ── 6. self-close ──────────────────────────────────────────────────
        This step used to open the OTT group and assert the Category group shut.
        With one group left, the surviving half of that same logic is that a
        second click on the open trigger closes it. The click above already
        re-opened the menu, so this must NOT click again before asserting. */
    ok('the menu is open again after re-clicking its trigger',
      win.getComputedStyle(dropMenu).display !== 'none',
      win.getComputedStyle(dropMenu).display);
    dropTrigger.click();
    ok('clicking the open trigger closes its own menu',
      win.getComputedStyle(dropMenu).display === 'none'
        && dropTrigger.getAttribute('aria-expanded') === 'false',
      win.getComputedStyle(dropMenu).display + ' aria=' + dropTrigger.getAttribute('aria-expanded'));
    // Leave it open for the Escape check below.
    dropTrigger.click();

    // ── 7. Escape closes ────────────────────────────────────────────────
    doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    ok('Escape closes the open menu',
      win.getComputedStyle(dropMenu).display === 'none');

    // ── 8. outside click closes ─────────────────────────────────────────
    dropTrigger.click();
    doc.body.click();
    ok('an outside click closes the menu',
      win.getComputedStyle(dropMenu).display === 'none');

    // ── 9. picking a platform filters, marks the trigger and closes ──────
    dropTrigger.click();
    var picked = catTabFor(doc, 'action');
    ok('Action lives inside the Category menu', !!picked && !!picked.closest('.cat-group-menu'));
    picked.click();

    ok('selected item becomes the active tab', picked.classList.contains('active'));
    ok('menu closes after picking an item',
      win.getComputedStyle(dropMenu).display === 'none');
    ok('trigger is marked while its child is the active filter',
      dropTrigger.classList.contains('has-active'));
    var heading = doc.getElementById('sectionHeading');
    ok('heading switched to the Action label',
      heading && /ACTION/i.test(heading.textContent), heading ? heading.textContent : '');

    // ── 10. THE INFINITE-SCROLL DEPENDENCY ──────────────────────────────
    // loadMoreMoviesAction() resolves the category to page next by reading
    // document.querySelector('.cat-tab.active').onclick. That element is now
    // inside a display:none menu, so this asserts the lookup still works.
    var activeTab = doc.querySelector('.cat-tab.active');
    ok('active tab is still queryable inside the closed menu',
      activeTab === picked,
      activeTab ? (activeTab.getAttribute('onclick') || activeTab.textContent) : 'null');
    var parsed = activeTab && /'([^']+)'/.exec(activeTab.getAttribute('onclick') || '');
    ok('infinite scroll can recover the category from it',
      parsed && parsed[1] === 'action', parsed ? parsed[1] : 'unparsable');

    ok('exactly one tab is active at a time',
      doc.querySelectorAll('.cat-tab.active').length === 1,
      String(doc.querySelectorAll('.cat-tab.active').length));

    // ── 11. switching to a direct tab clears the group marker ────────────
    catTabFor(doc, 'bollywood').click();
    ok('dropdown marker clears when a direct tab is chosen',
      !dropTrigger.classList.contains('has-active'));
    ok('direct tab becomes active', catTabFor(doc, 'bollywood').classList.contains('active'));

    // ── 12. genre inside the dropdown still filters ─────────────────────
    dropTrigger.click();
    var horror = catTabFor(doc, 'horror');
    horror.click();
    ok('a genre inside the dropdown filters correctly',
      horror.classList.contains('active')
        && /HORROR/i.test(doc.getElementById('sectionHeading').textContent));
    ok('dropdown trigger marked after selection',
      dropTrigger.classList.contains('has-active'));

    // ── 13. watchlist via the navbar; paging must be disabled for it ──────
    var navWatchlist = doc.querySelector('#navLinks a[onclick*="showWatchlist"]');
    navWatchlist.click();
    ok('navbar watchlist switches the heading',
      /WATCHLIST/i.test(doc.getElementById('sectionHeading').textContent));
    ok('group markers clear on the watchlist view',
      !dropTrigger.classList.contains('has-active')
        && !dropTrigger.classList.contains('has-active'));
    // Removing the Watchlist pill broke the old guard, which inferred the mode
    // from the active tab's onclick. The sentinel must now be hidden outright so
    // "all" movies cannot be paged into the watchlist grid.
    var sentinel = doc.getElementById('infiniteScrollTrigger');
    ok('infinite-scroll sentinel is hidden on the watchlist',
      sentinel && win.getComputedStyle(sentinel).display === 'none',
      sentinel ? win.getComputedStyle(sentinel).display : 'missing');

    // Leaving the watchlist re-enables paging.
    catTabFor(doc, 'all').click();
    ok('paging is re-enabled after leaving the watchlist',
      win.getComputedStyle(sentinel).display !== 'none',
      win.getComputedStyle(sentinel).display);

    // ── 14. no console errors while driving the UI ───────────────────────
    ok('no uncaught error surfaced in the app frame',
      !win.__mzHarnessError, win.__mzHarnessError || '');

    runTvModeChecks();
  }

  /*  TV MODE
   *  The strip must look EXACTLY like the laptop one: 12 chips plus two
   *  collapsed dropdowns. It used to render both menus permanently inline on
   *  TV, which unfolded 17 extra pills into a three-row cloud that ran into the
   *  grid — unreadable across the room.
   *
   *  A popup only works with a remote because watchCatGroups() in tv-mode.js
   *  invalidates the focus cache when `.is-open` flips (the DOM sweep observer
   *  listens for childList only, so a class toggle went unnoticed and the fresh
   *  items stayed unreachable) and moves the highlight into the panel / back to
   *  the trigger. If any of that regresses, every platform and genre filter
   *  becomes unreachable on a television, so it is all asserted here.  */
  function runTvModeChecks() {
    var tvFrame = document.createElement('iframe');
    tvFrame.style.cssText = 'width:1920px;height:1080px;border:1px solid #333';
    tvFrame.src = '/index.html?tv=1';
    document.body.appendChild(tvFrame);

    tvFrame.addEventListener('load', function () {
      setTimeout(function () {
        var tdoc, twin;
        try {
          tdoc = tvFrame.contentDocument;
          twin = tvFrame.contentWindow;
        } catch (e) {
          ok('TV frame accessible', false, e.message);
          report();
          return;
        }

        ok('TV mode actually engaged in the second frame',
          tdoc.documentElement.getAttribute('data-mz-tv') === 'true',
          String(tdoc.documentElement.getAttribute('data-mz-tv')));

        var tvDrop = tdoc.getElementById('catGroupGenreMenu');
        ok('TV: dropdown menu starts collapsed, same as the laptop',
          tvDrop && twin.getComputedStyle(tvDrop).display === 'none',
          tvDrop ? twin.getComputedStyle(tvDrop).display : 'n/a');
        ok('TV: genre menu starts collapsed, same as the laptop',
          tvDrop && twin.getComputedStyle(tvDrop).display === 'none',
          tvDrop ? twin.getComputedStyle(tvDrop).display : 'n/a');

        var tvTrigger = tdoc.getElementById('catGroupGenreBtn');
        ok('TV: the dropdown trigger is visible (there is something to open)',
          tvTrigger && twin.getComputedStyle(tvTrigger).display !== 'none',
          tvTrigger ? twin.getComputedStyle(tvTrigger).display : 'n/a');

        // The row must stay one line of chips, not a wrapped cloud.
        var tvVisible = Array.prototype.filter.call(tdoc.querySelectorAll('.cat-tab'),
          function (el) { return el.offsetParent !== null; });
        ok('TV: only the direct chips + 1 trigger are on the strip',
          tvVisible.length === DIRECT.length + 1,
          'visible .cat-tab = ' + tvVisible.length + ', expected ' + (DIRECT.length + 1));

        var items = tdoc.querySelectorAll('.cat-group-item');
        ok('TV: pills are keyboard reachable (tabIndex not negative)',
          items.length > 0 && Array.prototype.every.call(items, function (el) { return el.tabIndex >= 0; }));

        // OK on the focused trigger — exactly what a remote sends.
        tvTrigger.focus();
        tvTrigger.click();

        setTimeout(function () {
          ok('TV: OK on the trigger opens the panel',
            twin.getComputedStyle(tvDrop).display === 'flex',
            twin.getComputedStyle(tvDrop).display);

          ok('TV: the highlight moves into the panel',
            tvDrop.contains(tdoc.activeElement) &&
            tdoc.activeElement.classList.contains('cat-group-item'),
            tdoc.activeElement ? (tdoc.activeElement.className || tdoc.activeElement.tagName) : 'none');

          // Every open pill needs a real box or tv-mode's isVisibleRect skips it.
          var zeroSized = [];
          for (var i = 0; i < items.length; i++) {
            if (!tvDrop.contains(items[i])) continue;
            var r = items[i].getBoundingClientRect();
            if (r.width < 2 || r.height < 2) zeroSized.push(items[i].textContent.trim());
          }
          ok('TV: every pill in the open panel has a focusable box',
            zeroSized.length === 0, 'zero-sized: ' + zeroSized.join(', '));

          // The D-pad can only step down the list if the focus cache was rebuilt.
          var firstItem = tdoc.activeElement;
          tdoc.dispatchEvent(new twin.KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));

          setTimeout(function () {
            ok('TV: D-pad moves between panel items (focus cache refreshed)',
              tdoc.activeElement !== firstItem && tvDrop.contains(tdoc.activeElement),
              'activeElement = ' + (tdoc.activeElement ? tdoc.activeElement.textContent.trim() : 'none'));

            // Back must dismiss the panel instead of exiting the app.
            tdoc.dispatchEvent(new twin.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));

            setTimeout(function () {
              ok('TV: Back closes the panel',
                twin.getComputedStyle(tvDrop).display === 'none',
                twin.getComputedStyle(tvDrop).display);
              ok('TV: Back returns the highlight to the trigger (remote not stranded)',
                tdoc.activeElement === tvTrigger,
                tdoc.activeElement ? (tdoc.activeElement.id || tdoc.activeElement.tagName) : 'none');
              report();
            }, 400);
          }, 300);
        }, 400);
      }, 2500);
    });
  }

  // Capture errors from inside the frame so a silent exception cannot pass.
  frame.addEventListener('load', function () {
    try {
      frame.contentWindow.addEventListener('error', function (ev) {
        frame.contentWindow.__mzHarnessError = ev.message;
      });
    } catch (e) { /* ignore */ }
  });

  setTimeout(function () {
    if (!checks.length) {
      ok('harness completed before timeout', false, 'no checks ran');
      report();
    }
  }, 35000);
})();
</script>
</body>
</html>
