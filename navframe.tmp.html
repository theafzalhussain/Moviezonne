<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nav frame</title>
<link rel="stylesheet" href="/moviezone.css?probe=3">
<style id="mz-fonts">
@font-face{font-family:'Outfit';font-style:normal;font-weight:300 900;font-display:block;src:url(/fonts/outfit-latin-var.woff2) format('woff2')}
@font-face{font-family:'Bebas Neue';font-style:normal;font-weight:400;font-display:block;src:url(/fonts/bebas-neue-latin-400.woff2) format('woff2')}
</style>
<style>html,body{margin:0;background:#07070f}body{min-height:300px}</style>
</head>
<body>
<nav id="navbar" role="navigation" aria-label="Main navigation">
  <div class="nav-brand">
    <a class="nav-logo" href="#" aria-label="MovieZone home">
      <span class="nav-logo-mark">MZ</span>
      <span class="nav-logo-copy">
        <span class="nav-logo-main">MOVIEZONE</span>
        <span class="nav-logo-sub">Cinema Club</span>
      </span>
    </a>
  </div>
  <button class="hamburger-btn" id="hamburgerBtn" type="button" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
  <ul class="nav-links" id="navLinks">
    <li><a href="#" class="active">Home</a></li>
    <li><a href="#">Web Series</a></li>
    <li><a href="#">Upcoming</a></li>
    <li><a href="#">Anime</a></li>
    <li><a href="#">Watchlist</a></li>
  </ul>
  <div class="nav-search">
    <span class="search-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
    <input type="text" id="searchInput" placeholder="Search for movies, shows..." autocomplete="off">
    <kbd class="nav-kbd" id="navSearchKbd" aria-hidden="true">Ctrl K</kbd>
    <div class="search-results-dropdown" id="searchDropdown"></div>
  </div>
  <button class="nav-install-btn" id="navInstallBtn" title="Install MovieZone App" style="display:flex;">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span>Install</span>
  </button>
</nav>
<script>
(function () {
  var ul = document.getElementById('navLinks');
  function place(el) {
    if (!el) return;
    var box = ul.getBoundingClientRect();
    if (!box.width) return;
    var r = el.getBoundingClientRect();
    if (!r.width) return;
    var b = parseFloat(getComputedStyle(ul).borderLeftWidth) || 0;
    ul.style.setProperty('--nav-ind-x', (r.left - box.left - b) + 'px');
    ul.style.setProperty('--nav-ind-w', r.width + 'px');
    ul.classList.add('mz-ind-on');
  }
  function rest() { place(ul.querySelector('a.active')); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(rest);
  rest();
})();
</script>
</body>
</html>
