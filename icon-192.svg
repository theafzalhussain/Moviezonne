<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#03030a"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="30%" stop-color="#f5c518"/>
      <stop offset="70%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#f5c518"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#cc8800"/>
    </linearGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2"/>
      <feComposite operator="out" in="SourceGraphic"/>
      <feFlood flood-color="#000" flood-opacity="0.5"/>
      <feComposite operator="in" in2="A"/>
      <feComposite operator="over" in="SourceGraphic"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="38" ry="38" fill="url(#bgGrad)"/>
  
  <!-- Subtle border glow -->
  <rect width="192" height="192" rx="38" ry="38" fill="none" stroke="#f5c518" stroke-opacity="0.15" stroke-width="1.5"/>
  
  <!-- Film strip decoration left -->
  <rect x="14" y="30" width="12" height="8" rx="1.5" fill="#f5c518" fill-opacity="0.2"/>
  <rect x="14" y="46" width="12" height="8" rx="1.5" fill="#f5c518" fill-opacity="0.2"/>
  <rect x="14" y="62" width="12" height="8" rx="1.5" fill="#f5c518" fill-opacity="0.2"/>
  <rect x="14" y="122" width="12" height="8" rx="1.5" fill="#f5c518" fill-opacity="0.2"/>
  <rect x="14" y="138" width="12" height="8" rx="1.5" fill="#f5c518" fill-opacity="0.2"/>
  <rect x="14" y="154" width="12" height="8" rx="1.5" fill="#f5c518" fill-opacity="0.2"/>
  
  <!-- Film strip decoration right -->
  <rect x="166" y="30" width="12" height="8" rx="1.5" fill="#f5c518" fill-opacity="0.2"/>
  <rect x="166" y="46" width="12" height="8" rx="1.5" fill="#f5c518" fill-opacity="0.2"/>
  <rect x="166" y="62" width="12" height="8" rx="1.5" fill="#f5c518" fill-opacity="0.2"/>
  <rect x="166" y="122" width="12" height="8" rx="1.5" fill="#f5c518" fill-opacity="0.2"/>
  <rect x="166" y="138" width="12" height="8" rx="1.5" fill="#f5c518" fill-opacity="0.2"/>
  <rect x="166" y="154" width="12" height="8" rx="1.5" fill="#f5c518" fill-opacity="0.2"/>
  
  <!-- Play button triangle (cinema feel) -->
  <polygon points="72,60 72,132 136,96" fill="url(#goldGrad)" filter="url(#goldGlow)" opacity="0.12"/>
  
  <!-- Main "MZ" text -->
  <text x="96" y="108" font-size="62" font-weight="900" fill="url(#shineGrad)" text-anchor="middle" font-family="'Bebas Neue', 'Arial Black', sans-serif" letter-spacing="2" filter="url(#goldGlow)">MZ</text>
  
  <!-- Subtitle text -->
  <text x="96" y="134" font-size="11" font-weight="600" fill="#f5c518" fill-opacity="0.7" text-anchor="middle" font-family="'Outfit', sans-serif" letter-spacing="4">MOVIEZONE</text>
  
  <!-- Premium star accents -->
  <polygon points="96,20 98,26 104,26 99,30 101,36 96,32 91,36 93,30 88,26 94,26" fill="#f5c518" fill-opacity="0.5"/>
  <circle cx="50" cy="96" r="1.5" fill="#f5c518" fill-opacity="0.3"/>
  <circle cx="142" cy="96" r="1.5" fill="#f5c518" fill-opacity="0.3"/>
  
  <!-- Bottom accent line -->
  <rect x="60" y="148" width="72" height="2" rx="1" fill="url(#goldGrad)" fill-opacity="0.4"/>
</svg>
