name: SEO refresh

# Rebuilds the sitemap cache and the homepage link block, then commits them.
# Vercel deploys on push, so the live sitemaps and homepage links stay current
# without anyone touching the repo.
#
# Runs at 01:30 IST daily (20:00 UTC the previous day).

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: seo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Check the TMDB secret is present
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::error::Repository secret TMDB_TOKEN is not set."
            echo "::error::TMDB_TOKEN is required to rebuild sitemap-cache.json for the SEO refresh workflow."
            echo "Add it at: Settings > Secrets and variables > Actions > New repository secret"
            echo "Name it TMDB_TOKEN and use the same value server.js already uses."
            exit 1
          fi
          echo "TMDB_TOKEN is present (${#TMDB_TOKEN} characters)"

      - name: Rebuild the sitemap catalogue cache
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/build-sitemap-cache.js

      - name: Refresh the homepage link block
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/inject-home-links.js

      # Hand the SAME catalogue to the Cloudflare Worker.
      #
      # worker.js cannot read sitemap-cache.json: it has no filesystem, and the
      # file is in .assetsignore precisely so 500 KB of internal data is not
      # published. So it reads the catalogue from KV instead, under the key
      # "sitemap:catalog". Without this step the Worker still serves valid
      # sitemaps and /browse hubs, but from a bounded live TMDB build — a few
      # hundred titles per kind instead of the full ~7,800.
      #
      # Inert until both secrets exist, so adding this changed nothing for an
      # existing checkout. The API token needs only "Workers KV Storage: Edit".
      - name: Publish the catalogue to the Worker's KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set — skipping the KV upload."
            echo "The Worker will keep serving its bounded live-built sitemaps."
            exit 0
          fi
          max_attempts=5
          attempt=1
          delay_seconds=5
          upload_status=1
          last_error_code=""

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Uploading sitemap-cache.json to Cloudflare KV (attempt ${attempt}/${max_attempts})..."
            set +e
            wrangler_output=$(npx --yes wrangler@4 kv key put sitemap:catalog \
              --path sitemap-cache.json --binding TMDB_CACHE --remote 2>&1)
            upload_status=$?
            set -e
            echo "$wrangler_output"

            if [ "$upload_status" -eq 0 ]; then
              echo "Cloudflare KV upload succeeded."
              break
            fi

            last_error_code=$(echo "$wrangler_output" | sed -n 's/.*\[code: \([0-9][0-9]*\)\].*/\1/p' | tail -n 1)
            if [ -n "$last_error_code" ]; then
              echo "Cloudflare error code detected: ${last_error_code}"
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Cloudflare KV upload failed on attempt ${attempt}/${max_attempts}; retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              delay_seconds=$((delay_seconds * 2))
            fi

            attempt=$((attempt + 1))
          done

          if [ "$upload_status" -ne 0 ]; then
            echo "::warning::Cloudflare KV upload failed after ${max_attempts} attempts. Continuing without failing this workflow run."
            if [ -n "$last_error_code" ]; then
              echo "::warning::Last Cloudflare error code: ${last_error_code}"
            fi
            echo "::warning::See Cloudflare KV limits: https://developers.cloudflare.com/kv/platform/limits/"
          fi

      - name: Sanity-check the SEO layer before committing
        run: |
          node seo-ssr.test.js
          node worker-seo.test.js

      - name: Commit if anything changed
        run: |
          git config user.name  "seo-refresh[bot]"
          git config user.email "seo-refresh@users.noreply.github.com"
          git add sitemap-cache.json index.html
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
          else
            git pull --rebase origin main
            COUNT=$(node -p "const c=require('./sitemap-cache.json');c.movie.length+c.tv.length")
            git commit -m "chore(seo): refresh sitemap cache (${COUNT} titles) + homepage links"
            git push
          fi
